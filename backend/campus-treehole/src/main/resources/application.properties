spring.application.name=campus-treehole
server.port=${SERVER_PORT:18081}

# Load credentials from the backend directory, whether IDEA opens the project
# root or the backend directory. The file is local-only and ignored by Git.
spring.config.import=optional:file:./application-local.properties,optional:file:./backend/campus-treehole/application-local.properties

spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3306/campus_treehole}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD}

# Schema changes are performed explicitly, not during application startup.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
